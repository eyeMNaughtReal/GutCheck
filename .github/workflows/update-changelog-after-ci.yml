
name: Update CHANGELOG after successful CI on main

on:
  workflow_run:
    workflows: ["iOS Build & Test"]
    types: [completed]

permissions:
  contents: write

jobs:
  update-changelog:
    # Two of these conditions keep the workflow from feeding itself.
    #
    # The head_branch check is the load-bearing one. ios.yml runs on pushes to
    # main *and* development, so the bot's own commit can still start a build —
    # but that build is on development, and this job only reacts to main. The
    # loop is broken there.
    #
    # The commit-message check is the backstop for the day someone points this
    # job back at main. Then the bot's push would trigger a main build whose
    # success re-runs this job, each round adding an entry about the previous
    # round's commit. The last_sha marker does not help: it records the
    # triggering commit, which is new every time.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'docs(changelog):')
    runs-on: ubuntu-latest

    steps:
      # The entry describes what reached main, but it is written to
      # development: main's ruleset requires changes to arrive by pull request,
      # so a direct push from this job is rejected outright
      # ("GH013: Changes must be made through a pull request"). development is
      # unprotected, and the entry reaches main with the next release.
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Ensure CHANGELOG.md exists
        run: |
          if [ ! -f CHANGELOG.md ]; then
            cat > CHANGELOG.md <<'EOF'
          # Changelog

          All notable changes to this project will be documented in this file.
          EOF
          fi

      - name: Update changelog with latest successful main commit
        shell: bash
        run: |
          set -euo pipefail

          DATE="$(date -u +'%Y-%m-%d')"
          SHA="${{ github.event.workflow_run.head_sha }}"

          # Prevent duplicate entries
          if grep -q "^<!-- changelog:last_sha=${SHA} -->$" CHANGELOG.md; then
            echo "Changelog already includes this SHA."
            exit 0
          fi

          # Last processed SHA from top marker
          LAST_SHA="$(grep -m1 -E '^<!-- changelog:last_sha=[0-9a-f]{40} -->$' CHANGELOG.md \
            | sed -E 's/^<!-- changelog:last_sha=([0-9a-f]{40}) -->$/\1/' || true)"

          # The commits being described live on main, and the checkout is
          # development, so make sure main's history is present.
          git fetch --no-tags origin main

          if [ -n "${LAST_SHA:-}" ]; then
            RANGE="${LAST_SHA}..${SHA}"
          else
            FIRST_COMMIT="$(git rev-list --max-parents=0 origin/main | tail -n1)"
            RANGE="${FIRST_COMMIT}..${SHA}"
          fi

          NEW_ENTRIES="$(git log "${RANGE}" --pretty=format:'- %s (%h)' --no-merges || true)"

          if [ -z "${NEW_ENTRIES}" ]; then
            echo "No new entries to add."
            exit 0
          fi

          TMP="$(mktemp)"
          {
            echo "# Changelog"
            echo
            echo "<!-- changelog:last_sha=${SHA} -->"
            echo
            echo "## ${DATE}"
            echo
            echo "${NEW_ENTRIES}"
            echo
            awk '
              BEGIN { skipped_title=0; skipped_marker=0 }
              {
                if (!skipped_title && $0 == "# Changelog") { skipped_title=1; next }
                if (!skipped_marker && $0 ~ /^<!-- changelog:last_sha=[0-9a-f]{40} -->$/) { skipped_marker=1; next }
                print
              }
            ' CHANGELOG.md
          } > "$TMP"

          mv "$TMP" CHANGELOG.md

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet CHANGELOG.md; then
            echo "No CHANGELOG changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          # [skip ci] keeps a changelog-only commit from spending a full
          # iOS Build & Test run on development. It is not what prevents the
          # loop — the head_branch guard on the job does that. See the comment
          # there before removing either.
          git commit -m "docs(changelog): update after successful CI on main [skip ci]"

          # development is unprotected but can move while this job runs, so
          # rebase rather than failing the run on a race.
          git pull --rebase origin development
          git push origin development
