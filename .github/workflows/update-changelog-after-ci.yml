name: Update CHANGELOG after successful CI on main

on:
  workflow_run:
    workflows: ["iOS Build & Test"]
    types: [completed]

permissions:
  contents: write

jobs:
  update-changelog:
    # Two of these conditions keep the workflow from feeding itself.
    #
    # The head_branch check is the load-bearing one. ios.yml runs on pushes to
    # main *and* development, so the bot's own commit can still start a build —
    # but that build is on development, and this job only reacts to main. The
    # loop is broken there.
    #
    # The commit-message check is the backstop for the day someone points this
    # job back at main. Then the bot's push would trigger a main build whose
    # success re-runs this job, each round adding an entry about the previous
    # round's commit. The last_sha marker does not help: it records the
    # triggering commit, which is new every time.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'docs(changelog):')
    runs-on: ubuntu-latest

    steps:
      # The entry describes what reached main, but it is written to
      # development: main's ruleset requires changes to arrive by pull request,
      # so a direct push from this job is rejected outright
      # ("GH013: Changes must be made through a pull request"). development is
      # unprotected, and the entry reaches main with the next release.
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Ensure CHANGELOG.md exists
        run: |
          if [ ! -f CHANGELOG.md ]; then
            cat > CHANGELOG.md <<'EOF'
          # Changelog

          All notable changes to this project will be documented in this file.
          EOF
          fi

      - name: Update changelog with latest successful main commit
        shell: bash
        run: |
          set -euo pipefail

          DATE="$(date -u +'%Y-%m-%d')"
          SHA="${{ github.event.workflow_run.head_sha }}"

          # Prevent duplicate entries
          if grep -q "^<!-- changelog:last_sha=${SHA} -->$" CHANGELOG.md; then
            echo "Changelog already includes this SHA."
            exit 0
          fi

          # Last processed SHA from top marker
          LAST_SHA="$(grep -m1 -E '^<!-- changelog:last_sha=[0-9a-f]{40} -->$' CHANGELOG.md \
            | sed -E 's/^<!-- changelog:last_sha=([0-9a-f]{40}) -->$/\1/' || true)"

          # The commits being described live on main, and the checkout is
          # development, so make sure main's history is present.
          git fetch --no-tags origin main

          if [ -n "${LAST_SHA:-}" ]; then
            RANGE="${LAST_SHA}..${SHA}"
          else
            FIRST_COMMIT="$(git rev-list --max-parents=0 origin/main | tail -n1)"
            RANGE="${FIRST_COMMIT}..${SHA}"
          fi

          NEW_ENTRIES="$(git log "${RANGE}" --pretty=format:'- %s (%h)' --no-merges || true)"

          if [ -z "${NEW_ENTRIES}" ]; then
            echo "No new entries to add."
            exit 0
          fi

          # Rewritten in Python rather than awk/sed: the previous version always
          # spliced a brand-new "## DATE" header above whatever was left of the
          # old file, verbatim. Two releases landing the same day produced two
          # adjacent headers for that date, and the preamble paragraph — which
          # lived below the marker in the original hand-written file — got
          # pushed one section further down on every single run, eventually
          # ending up sandwiched between unrelated dates.
          #
          # This version treats the title, marker and preamble as fixed,
          # regenerated fresh each run rather than carried over from the old
          # file, and merges into the top dated section when it already matches
          # today's date instead of adding a second header for the same day.
          DATE="$DATE" SHA="$SHA" NEW_ENTRIES="$NEW_ENTRIES" python3 <<'PYEOF'
          import os

          date = os.environ["DATE"]
          sha = os.environ["SHA"]
          new_entries = os.environ["NEW_ENTRIES"]

          PREAMBLE = (
              "All notable changes to GutCheck, newest first. Each section is dated by the day\n"
              "the work reached `main`.\n"
              "\n"
              "New sections are prepended automatically after every successful CI run on\n"
              "`main`; the marker above records where the bot last read from. See CLAUDE.md\n"
              "before editing this file by hand."
          )

          with open("CHANGELOG.md") as f:
              old = f.read()

          # Strip the title, marker, and preamble block, so they don't
          # accumulate copy after copy. What is left starts at the first
          # dated ("## ") header, i.e. the actual changelog content.
          lines = old.splitlines()
          i = 0
          if i < len(lines) and lines[i].strip() == "# Changelog":
              i += 1
          while i < len(lines) and lines[i].strip() == "":
              i += 1
          if i < len(lines) and lines[i].startswith("<!-- changelog:last_sha="):
              i += 1
          while i < len(lines) and not lines[i].startswith("## "):
              i += 1

          rest_lines = lines[i:]
          top_header = rest_lines[0] if rest_lines else ""

          if top_header == f"## {date}":
              # Same-day release: fold into the existing section for today
              # rather than adding a second header for the same date.
              body = "\n".join(rest_lines[1:]).lstrip("\n")
              new_rest = f"## {date}\n\n{new_entries}\n\n{body}"
          else:
              rest = "\n".join(rest_lines)
              new_rest = f"## {date}\n\n{new_entries}\n\n{rest}"

          out = (
              "# Changelog\n\n"
              f"<!-- changelog:last_sha={sha} -->\n\n"
              f"{PREAMBLE}\n\n"
              f"{new_rest.rstrip()}\n"
          )

          with open("CHANGELOG.md", "w") as f:
              f.write(out)
          PYEOF

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet CHANGELOG.md; then
            echo "No CHANGELOG changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          # [skip ci] keeps a changelog-only commit from spending a full
          # iOS Build & Test run on development. It is not what prevents the
          # loop — the head_branch guard on the job does that. See the comment
          # there before removing either.
          git commit -m "docs(changelog): update after successful CI on main [skip ci]"

          # development is unprotected but can move while this job runs, so
          # rebase rather than failing the run on a race.
          git pull --rebase origin development
          git push origin development
