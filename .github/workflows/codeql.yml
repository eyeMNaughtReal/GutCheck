name: CodeQL

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  schedule:
    # Run every Monday at 08:00 UTC for ongoing security coverage
    - cron: '0 8 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Swift requires macOS; all other languages run on ubuntu for speed
    runs-on: ${{ matrix.language == 'swift' && 'macos-15' || 'ubuntu-latest' }}

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Primary language — Swift/iOS app
          - language: swift
            build-mode: manual
          # GitHub Actions workflow files
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ── Swift-only setup ────────────────────────────────────────────────────
      - name: Set up Xcode
        if: matrix.language == 'swift'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Create mock Secrets.swift
        if: matrix.language == 'swift'
        run: |
          cat > Secrets.swift << 'EOF'
          // Generated by CI. The real Secrets.swift is gitignored, so this stub
          // satisfies the compiler with a placeholder key. Never used at runtime
          // in CI - nothing here calls the USDA API.
          enum Secrets {
              static let usdaAPIKey = "MOCK-USDA-API-KEY-NOT-REAL-DO-NOT-USE"
          }
          EOF
        working-directory: GutCheck/GutCheck

      # ── CodeQL core steps ───────────────────────────────────────────────────
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Swift project for CodeQL
        if: matrix.language == 'swift'
        working-directory: GutCheck
        run: |
          xcodebuild build \
            -project GutCheck.xcodeproj \
            -scheme GutCheck \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
