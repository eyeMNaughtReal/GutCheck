name: CodeQL

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
    # Documentation and metadata changes can't introduce a code vulnerability,
    # and the Swift analysis rebuilds the whole app regardless of what changed.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/dependabot.yml'
  schedule:
    # Run every Monday at 08:00 UTC for ongoing security coverage
    - cron: '0 8 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Swift requires macOS; all other languages run on ubuntu for speed.
    # macOS 26 or newer for the same reason as the build workflow:
    # FoundationModels needs the iOS 26 SDK, which macos-15 does not carry.
    runs-on: ${{ matrix.language == 'swift' && 'macos-26' || 'ubuntu-latest' }}

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # The Swift leg rebuilds the entire app so CodeQL can trace
        # compilation, and measured 48-107 minutes against about 5 for Build
        # and Test. That figure was taken while Firebase, gRPC and abseil were
        # still being compiled; with the SPM dependencies gone it should be
        # markedly lower, but it has not been re-measured, so the filtering
        # below stays until it has. Dropping it from pull_request leaves PRs
        # completing in minutes; it still runs on every push to main and
        # development, plus the Monday schedule, so nothing reaches either
        # branch unanalysed.
        #
        # Filtered here rather than with a job-level `if`, because the matrix
        # context isn't available in job-level conditions - doing that produced
        # a workflow that failed to start at all.
        include: ${{ github.event_name == 'pull_request'
          && fromJSON('[{"language":"actions","build-mode":"none"}]')
          || fromJSON('[{"language":"swift","build-mode":"manual"},{"language":"actions","build-mode":"none"}]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ── Swift-only setup ────────────────────────────────────────────────────
      - name: Set up Xcode
        if: matrix.language == 'swift'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      # The same gate as the build workflow — see .github/workflows/ios.yml.
      # CodeQL's Swift analysis compiles the whole app, so it hits the missing
      # iOS 27 SDK exactly as the build does, and this workflow was left failing
      # when ios.yml was guarded.
      #
      # Skipping matters more here than there: a failing Swift analysis produces
      # no results at all, so the Swift code silently stops being scanned. A
      # skipped job that says so is at least honest about the gap.
      - name: Check for the iOS 27 SDK
        id: sdk
        if: matrix.language == 'swift'
        run: |
          if xcodebuild -showsdks | grep -qi 'iphonesimulator2[7-9]'; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Swift security analysis skipped::This runner has no iOS 27 SDK ($(xcodebuild -version | head -1)), which the project needs to compile. CodeQL cannot trace a build that did not happen, so the Swift code was NOT scanned for vulnerabilities in this run."
          fi

      - name: Create mock Secrets.swift
        if: matrix.language == 'swift'
        run: |
          cat > Secrets.swift << 'EOF'
          // Generated by CI. The real Secrets.swift is gitignored, so this stub
          // satisfies the compiler with a placeholder key. Never used at runtime
          // in CI - nothing here calls the USDA API.
          enum Secrets {
              static let usdaAPIKey = "MOCK-USDA-API-KEY-NOT-REAL-DO-NOT-USE"
          }
          EOF
        working-directory: GutCheck/GutCheck

      # ── CodeQL core steps ───────────────────────────────────────────────────
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Swift project for CodeQL
        if: matrix.language == 'swift' && steps.sdk.outputs.available == 'true'
        working-directory: GutCheck
        run: |
          xcodebuild build \
            -project GutCheck.xcodeproj \
            -scheme GutCheck \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      # Skipped alongside the build. In `manual` build-mode CodeQL fails with
      # "no source code was seen" when nothing compiled, which would turn a
      # deliberate skip back into a red check.
      - name: Perform CodeQL Analysis
        if: matrix.language != 'swift' || steps.sdk.outputs.available == 'true'
        uses: github/codeql-action/analyze@v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
