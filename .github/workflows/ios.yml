name: iOS Build & Test

permissions:
  contents: read
  actions: write

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  build-and-test:
    name: Build and Test
    # macOS 26 or newer. FoundationModels ships in the iOS 26 SDK, which the
    # macos-15 images do not have — they top out at Xcode 16 / iOS 18, where
    # `import FoundationModels` fails outright.
    #
    # Note the image currently provides Xcode 26.6 / iOS 26.5 while the project
    # declares a 27.0 deployment target, so CI compiles against an older SDK
    # than the app targets. That builds today but is worth revisiting once an
    # Xcode 27 image is available.
    runs-on: macos-26

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    # 'latest' rather than 'latest-stable': multimodal prompting in
    # FoundationModels (the Attachment type) exists only in the iOS 27 SDK,
    # and latest-stable selected Xcode 26.6 / iOS 26.5, where the photo
    # identification feature does not compile.
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest'

    # Lists every Xcode the image carries. If the build fails on a missing
    # SDK, this says whether a newer toolchain was even available to pick.
    - name: List available Xcode versions
      run: ls -1 /Applications | grep -i '^Xcode' || true

    # Records which Xcode and SDKs the runner actually provides. The project
    # needs the iOS 27 SDK; if a future image regresses, this is the first
    # place to look rather than reading it out of a compiler error.
    - name: Report toolchain
      run: |
        xcodebuild -version
        xcodebuild -showsdks | grep -i iphonesimulator || true

    - name: Cache Swift Package Manager
      uses: actions/cache@v6
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm/
          GutCheck/.build
        key: ${{ runner.os }}-spm-${{ hashFiles('GutCheck/GutCheck.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Cache DerivedData
      uses: actions/cache@v6
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-deriveddata-${{ hashFiles('GutCheck/GutCheck.xcodeproj/project.pbxproj') }}
        restore-keys: |
          ${{ runner.os }}-deriveddata-

    - name: Create Secrets.swift (Mock)
      run: |
        cat > Secrets.swift << 'EOF'
        // Generated by CI. The real Secrets.swift is gitignored, so this stub
        // satisfies the compiler with a placeholder key. Never used at runtime
        // in CI - nothing here calls the USDA API.
        enum Secrets {
            static let usdaAPIKey = "MOCK-USDA-API-KEY-NOT-REAL-DO-NOT-USE"
        }
        EOF
      working-directory: GutCheck/GutCheck

    - name: Build GutCheck
      run: |
        xcodebuild build \
          -project GutCheck.xcodeproj \
          -scheme GutCheck \
          -sdk iphonesimulator \
          -onlyUsePackageVersionsFromResolvedFile \
          -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO
      working-directory: GutCheck

    - name: Upload Build Artifacts on Failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: build-logs
        path: ~/Library/Developer/Xcode/DerivedData/Build/Logs/
        retention-days: 5
