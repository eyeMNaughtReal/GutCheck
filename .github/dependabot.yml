version: 2

updates:
  # Swift Package Manager
  #
  # The project currently declares no package dependencies — removing Firebase
  # took the only one with it, and everything the app needs now ships with the
  # platform (SwiftData, HealthKit, BackgroundTasks). This entry is kept so
  # updates start flowing again the moment a package is added.
  - package-ecosystem: "swift"
    directory: "/GutCheck"
    # Day-to-day work happens on `development`; main is the release branch.
    # Without this Dependabot targets the repo default (main), so dependency
    # PRs would land on a branch the feature work never merges through and the
    # two would silently diverge.
    target-branch: "development"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    # Only direct dependencies. Transitive entries in Package.resolved are
    # chosen by their parent package's manifest: Dependabot can edit those
    # lines, but SPM overwrites them on the next resolve, producing a PR that
    # appears to upgrade something, merges green, and leaves the lockfile
    # inconsistent with what actually resolves. That happened twice (see #326)
    # before this was scoped.
    allow:
      - dependency-type: "direct"
    labels:
      - "dependencies"
      - "swift"

  # GitHub Actions — keep workflow action versions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    # Day-to-day work happens on `development`; main is the release branch.
    # Without this Dependabot targets the repo default (main), so dependency
    # PRs would land on a branch the feature work never merges through and the
    # two would silently diverge.
    target-branch: "development"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
